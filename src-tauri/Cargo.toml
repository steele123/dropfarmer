[package]
name = "dropfarmer"
version = "0.1.11"
description = "A desktop Twitch drop queue"
edition = "2021"

[lib]
name = "dropfarmer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
open = "5"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
